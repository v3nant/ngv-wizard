name: Demo claim

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Your ngrok URL, e.g. https://abcd1234.ngrok-free.app'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize the server URL
        id: url
        run: |
          CLEAN=$(printf '%s' "${{ inputs.server_url }}" | tr -d '\r\n' | xargs)
          echo "Using server_url: [$CLEAN]"
          echo "value=$CLEAN" >> "$GITHUB_OUTPUT"

      - name: Request an OIDC token
        id: token
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=evergreen-executor" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Claim the queued run
        id: claim
        env:
          SERVER_URL: ${{ steps.url.outputs.value }}
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST "$SERVER_URL/api/executors/runs/claim" \
            -H "Authorization: Bearer $TOKEN")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          RUN_ID=$(echo "$BODY" | jq -r '.run.id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Report progress
        if: steps.claim.outputs.run_id != ''
        env:
          SERVER_URL: ${{ steps.url.outputs.value }}
          TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ steps.claim.outputs.run_id }}
        run: |
          curl -i -X POST "$SERVER_URL/api/executors/runs/$RUN_ID/progress" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"progress":"Resolving dependencies (demo)"}'

      - name: Report completion
        if: steps.claim.outputs.run_id != ''
        env:
          SERVER_URL: ${{ steps.url.outputs.value }}
          TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ steps.claim.outputs.run_id }}
        run: |
          curl -i -X POST "$SERVER_URL/api/executors/runs/$RUN_ID/complete" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"outcome":"completed"}'
