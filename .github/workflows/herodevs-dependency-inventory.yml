# Generated by HeroDevs Evergreen.
# Runs whenever HeroDevs has a scan ready for this repository: checks out
# the branch being scanned and resolves its dependencies ahead of time.
name: HeroDevs Evergreen dependency inventory (on demand)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Request an OIDC token
        id: token
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=evergreen-executor" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Claim the queued run
        id: claim
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST "https://encroach-skies-flock.ngrok-free.dev/evergreen/api/executors/runs/claim" \
            -H "Authorization: Bearer $TOKEN")
          STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$STATUS" = "204" ]; then
            echo "Nothing queued for this repository right now."
            echo "claimed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$STATUS" != "200" ]; then
            echo "Claim failed with status $STATUS: $BODY"
            exit 1
          fi
          echo "claimed=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$(echo "$BODY" | jq -r '.run.id')" >> "$GITHUB_OUTPUT"
          echo "scan_branch=$(echo "$BODY" | jq -r '.run.scanBranch')" >> "$GITHUB_OUTPUT"

      - name: Check out the claimed run's scan branch
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.claim.outputs.scan_branch }}

      - name: Resolve the lockfile
        if: steps.claim.outputs.claimed == 'true'
        id: resolve
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ steps.claim.outputs.run_id }}
        run: |
          LOCKFILE=""
          for candidate in package-lock.json npm-shrinkwrap.json yarn.lock pnpm-lock.yaml; do
            if [ -f "$candidate" ]; then
              LOCKFILE="$candidate"
              break
            fi
          done
          if [ -n "$LOCKFILE" ]; then
            echo "Scanning against the committed $LOCKFILE."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "lockfile=$LOCKFILE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f package.json ]; then
            curl -sS -X POST "https://encroach-skies-flock.ngrok-free.dev/evergreen/api/executors/runs/$RUN_ID/complete" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"outcome":"failed","reason":"no_committed_lockfile"}'
            exit 0
          fi
          echo "No lockfile is committed on this branch: resolving one."
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
          echo "generated=true" >> "$GITHUB_OUTPUT"
          echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"

      - name: Report the generated lockfile
        if: steps.claim.outputs.claimed == 'true' && steps.resolve.outputs.generated == 'true'
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ steps.claim.outputs.run_id }}
        run: |
          jq -n --rawfile content package-lock.json '{content: $content}' \
            | curl -sS -X POST "https://encroach-skies-flock.ngrok-free.dev/evergreen/api/executors/runs/$RUN_ID/lockfile" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d @-

      - name: Report progress
        if: steps.claim.outputs.claimed == 'true' && steps.resolve.outputs.lockfile != ''
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ steps.claim.outputs.run_id }}
          LOCKFILE: ${{ steps.resolve.outputs.lockfile }}
        run: |
          case "$LOCKFILE" in
            package-lock.json|npm-shrinkwrap.json)
              COUNT=$(jq '.packages | length' "$LOCKFILE" 2>/dev/null || echo 0)
              MESSAGE="Resolved $COUNT dependencies from $LOCKFILE. Building an SBOM to submit."
              ;;
            yarn.lock)
              COUNT=$(grep -c 'resolved ' "$LOCKFILE" 2>/dev/null || echo 0)
              MESSAGE="Resolved $COUNT dependencies from $LOCKFILE. Building an SBOM to submit."
              ;;
            *)
              MESSAGE="Resolved dependencies from $LOCKFILE. Building an SBOM to submit."
              ;;
          esac
          curl -sS -X POST "https://encroach-skies-flock.ngrok-free.dev/evergreen/api/executors/runs/$RUN_ID/progress" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"progress\":\"$MESSAGE\"}"

      - name: Generate an SBOM
        if: steps.claim.outputs.claimed == 'true' && steps.resolve.outputs.lockfile != ''
        run: |
          CDXGEN_HOME=$(mktemp -d)
          (cd "$CDXGEN_HOME" && npm install --no-save --no-audit --no-fund --ignore-scripts --legacy-peer-deps @cyclonedx/cdxgen@12.5.1)
          cat > "$CDXGEN_HOME/generate-sbom.mjs" <<'NODE_SCRIPT'
          import { writeFileSync } from 'node:fs'
          import { createBom } from '@cyclonedx/cdxgen'
          import { postProcess } from '@cyclonedx/cdxgen/stages/postgen/postgen'

          const options = {
            $0: 'cdxgen',
            _: [],
            'auto-compositions': true,
            autoCompositions: true,
            'data-flow-slices-file': 'data-flow.slices.json',
            dataFlowSlicesFile: 'data-flow.slices.json',
            deep: false,
            'deps-slices-file': 'deps.slices.json',
            depsSlicesFile: 'deps.slices.json',
            evidence: false,
            'export-proto': false,
            exportProto: false,
            'fail-on-error': false,
            failOnError: false,
            'include-crypto': false,
            'include-formulation': false,
            includeCrypto: false,
            includeFormulation: false,
            'no-install-deps': true,
            noInstallDeps: true,
            'min-confidence': 0.1,
            minConfidence: 0.1,
            multiProject: true,
            'no-banner': false,
            noBabel: false,
            noBanner: false,
            o: 'bom.json',
            output: 'bom.json',
            outputFormat: 'json',
            author: ['HeroDevs, Inc.'],
            profile: 'generic',
            project: undefined,
            'project-version': '',
            projectVersion: '',
            'proto-bin-file': 'bom.cdx',
            protoBinFile: 'bom.cdx',
            r: false,
            'reachables-slices-file': 'reachables.slices.json',
            reachablesSlicesFile: 'reachables.slices.json',
            recurse: false,
            requiredOnly: false,
            'semantics-slices-file': 'semantics.slices.json',
            semanticsSlicesFile: 'semantics.slices.json',
            'skip-dt-tls-check': true,
            skipDtTlsCheck: true,
            'spec-version': 1.6,
            specVersion: 1.6,
            tools: [{ name: 'herodevs-evergreen-executor', publisher: 'HeroDevs, Inc.', version: 'interim' }],
            'usages-slices-file': 'usages.slices.json',
            usagesSlicesFile: 'usages.slices.json',
            validate: true
          }

          const directory = process.cwd()
          const sbom = await createBom(directory, options)
          if (!sbom) {
            console.error('SBOM not generated')
            process.exit(1)
          }
          const postProcessed = postProcess(sbom, options, directory)
          if (!postProcessed) {
            console.error('SBOM not generated')
            process.exit(1)
          }
          writeFileSync('sbom.json', JSON.stringify(postProcessed.bomJson))
          NODE_SCRIPT
          node "$CDXGEN_HOME/generate-sbom.mjs"

      - name: Submit the SBOM
        if: steps.claim.outputs.claimed == 'true' && steps.resolve.outputs.lockfile != ''
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ steps.claim.outputs.run_id }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          jq -n --rawfile content sbom.json --arg commit "$COMMIT" '{content: $content, claimedCommit: $commit}' \
            | curl -sS -X POST "https://encroach-skies-flock.ngrok-free.dev/evergreen/api/executors/runs/$RUN_ID/sbom" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d @-
